<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>กำลังเข้าร่วมเซิร์ฟเวอร์... | Roblox</title>
    <!-- Google Fonts: Outfit -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00B06F;
            --background: #0D1117;
            --card-bg: rgba(22, 27, 34, 0.6);
            --text-main: #FFFFFF;
            --text-muted: #8B949E;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, #09090E 0%, #1A1A24 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
            overflow: hidden;
        }

        /* Glassmorphism Card */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            padding: 40px;
            text-align: center;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.8s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .spinner {
            width: 64px;
            height: 64px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            margin: 0 auto 24px auto;
            animation: spin 1s linear infinite;
        }

        h1 {
            font-weight: 800;
            font-size: 24px;
            margin: 0 0 10px 0;
            background: linear-gradient(90deg, #FFFFFF, #B0BEC5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: var(--text-muted);
            font-size: 15px;
            margin: 0 0 24px 0;
            line-height: 1.5;
        }

        .btn {
            display: inline-block;
            background: var(--primary);
            color: #000;
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 176, 111, 0.3);
        }

        .btn:hover {
            background: #00C87F;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 176, 111, 0.4);
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .error-state {
            display: none;
        }
    </style>
</head>
<body>

    <div class="card" id="mainCard">
        <div class="spinner" id="spinner"></div>
        <h1 id="titleText">กำลังเข้าสู่เซิร์ฟเวอร์...</h1>
        <p id="subText">กรุณารอสักครู่ เบราว์เซอร์กำลังจะเปิดตัวเกม Roblox ให้คุณอัตโนมัติ</p>
        
        <a href="#" id="manualBtn" class="btn" style="display: none;">กดที่นี่หากเกมไม่เปิดขึ้นมา</a>
        
        <div class="error-state" id="errorState">
            <h1 style="background: #FF5252; -webkit-background-clip: text; -webkit-text-fill-color: transparent;">เกิดข้อผิดพลาด</h1>
            <p>ลิงก์ไม่สมบูรณ์ ขาดข้อมูล PlaceId หรือ JobId</p>
        </div>
    </div>

    <script>
        // ฟังก์ชันดึงค่าจาก URL Parameters
        function getQueryParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                placeId: params.get('placeId'),
                jobId: params.get('jobId')
            };
        }

        window.onload = function() {
            const { placeId, jobId } = getQueryParams();

            if (placeId && jobId) {
                // สร้างลิงก์ Deep Link สำหรับเปิดตัวเกม Roblox
                const robloxDeepLink = `roblox://experiences/start?placeId=${placeId}&gameInstanceId=${jobId}`;
                
                // เตรียมปุ่มสำหรับกดเองเผื่อเบราว์เซอร์บล็อกการเด้งอัตโนมัติ
                const manualBtn = document.getElementById('manualBtn');
                manualBtn.href = robloxDeepLink;

                // สั่งเปิดตัวเกมทันที
                window.location.href = robloxDeepLink;

                // ถ้าผ่านไป 3 วินาที แสดงปุ่มให้กดเอง
                setTimeout(() => {
                    document.getElementById('spinner').style.display = 'none';
                    document.getElementById('titleText').innerText = 'รัน Roblox แล้ว';
                    document.getElementById('subText').innerText = 'ถ้าเกมยังไม่เปิด กรุณากดปุ่มด้านล่างเพื่อเปิดเกมด้วยตัวเอง';
                    manualBtn.style.display = 'inline-block';
                }, 3000);
            } else {
                // กรณีไม่มี URL Params มาให้
                document.getElementById('spinner').style.display = 'none';
                document.getElementById('titleText').style.display = 'none';
                document.getElementById('subText').style.display = 'none';
                document.getElementById('errorState').style.display = 'block';
            }
        };
    </script>

</body>
</html>
